<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">냉장고를 부탁해 AX 멀티 에이전트 서비스 흐름</title>
  <desc id="desc">냉장고 CSV가 Agent 1의 브리핑 A가 되고, Agent 2의 레시피 B와 Agent 3의 검증을 거쳐 Agent 4의 장보기 추천으로 이어지는 구조. 홈 바로 장보기는 A를, 요리 후 장보기는 검증된 A와 B를 전달한다.</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d0f14"/>
      <stop offset="0.55" stop-color="#131720"/>
      <stop offset="1" stop-color="#0b0d12"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20242d"/>
      <stop offset="1" stop-color="#171a21"/>
    </linearGradient>
    <linearGradient id="agent1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#253548"/>
      <stop offset="1" stop-color="#1b222c"/>
    </linearGradient>
    <linearGradient id="agent2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b3024"/>
      <stop offset="1" stop-color="#211d19"/>
    </linearGradient>
    <linearGradient id="agent3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#352847"/>
      <stop offset="1" stop-color="#211b2b"/>
    </linearGradient>
    <linearGradient id="agent4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#214239"/>
      <stop offset="1" stop-color="#182822"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity=".025" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity=".38"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowSilver" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#cfd5df"/>
    </marker>
    <marker id="arrowBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6fb3ff"/>
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ffad55"/>
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bb8cff"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#63d6ad"/>
    </marker>
    <style>
      text { font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
      .eyebrow { font-size: 15px; font-weight: 800; letter-spacing: 2.6px; fill: #8e98a8; }
      .title { font-size: 37px; font-weight: 900; letter-spacing: -1.2px; fill: #f4f6f9; }
      .subtitle { font-size: 18px; font-weight: 500; fill: #aab2bf; }
      .node-label { font-size: 13px; font-weight: 900; letter-spacing: 1.4px; }
      .node-title { font-size: 24px; font-weight: 900; letter-spacing: -.5px; fill: #f5f7fa; }
      .node-copy { font-size: 16px; font-weight: 600; fill: #c8ced8; }
      .node-small { font-size: 14px; font-weight: 600; fill: #aab2bf; }
      .output { font-size: 15px; font-weight: 750; fill: #edf1f6; }
      .pill-text { font-size: 14px; font-weight: 850; }
      .flow-label { font-size: 14px; font-weight: 850; }
      .footer-title { font-size: 15px; font-weight: 900; fill: #f0f3f7; }
      .footer-copy { font-size: 14px; font-weight: 600; fill: #aab2bf; }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#background)"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <rect x="42" y="38" width="1516" height="824" rx="28" fill="none" stroke="#303642" stroke-width="1.5"/>

  <!-- Header -->
  <text x="76" y="86" class="eyebrow">MULTI-AGENT SERVICE ARCHITECTURE</text>
  <text x="76" y="134" class="title">냉장고를 부탁해 AX · 에이전트 협업 흐름</text>
  <text x="76" y="170" class="subtitle">완료된 결과 A/B를 CrewAI Task context로 전달하고, 사용자의 선택에 따라 두 개의 장보기 경로로 분기</text>
  <g transform="translate(1324 74)">
    <rect width="180" height="56" rx="14" fill="#181b22" stroke="#363c48"/>
    <text x="90" y="23" text-anchor="middle" class="node-small" fill="#d4dae3">CrewAI · 4 Agents</text>
    <text x="90" y="43" text-anchor="middle" font-size="13" font-weight="800" fill="#798393">Generate → Verify → Act</text>
  </g>

  <!-- Data input -->
  <g filter="url(#shadow)">
    <rect x="72" y="236" width="246" height="400" rx="22" fill="url(#panel)" stroke="#3a414e" stroke-width="1.5"/>
    <rect x="94" y="258" width="74" height="27" rx="8" fill="#29303b"/>
    <text x="131" y="277" text-anchor="middle" class="node-label" fill="#aeb7c5">DATA</text>
    <text x="94" y="324" class="node-title">냉장고 재고</text>
    <text x="94" y="350" class="node-small">nbax_fridge.csv · 44종</text>

    <rect x="94" y="382" width="202" height="94" rx="14" fill="#13161c" stroke="#343b47"/>
    <text x="112" y="411" class="output">재료명 · 수량 · 단위</text>
    <text x="112" y="436" class="output">유통기한 · 구매일</text>
    <text x="112" y="461" class="node-small">Single source of truth</text>

    <path d="M 195 493 L 195 528" stroke="#7d8796" stroke-width="2" marker-end="url(#arrowSilver)"/>
    <rect x="94" y="534" width="202" height="76" rx="14" fill="#17202a" stroke="#36516b"/>
    <text x="112" y="562" class="output" fill="#dceaff">Python 전처리</text>
    <text x="112" y="588" class="node-small">D-day 계산 · 날짜순 정렬</text>
  </g>

  <!-- Preprocessed inventory into Agent 1 -->
  <path d="M 318 320 L 368 320" fill="none" stroke="#cfd5df" stroke-width="2.6" marker-end="url(#arrowSilver)"/>
  <text x="343" y="307" text-anchor="middle" font-size="11" font-weight="900" fill="#9fa8b6">CSV</text>

  <!-- Agent 1 -->
  <g filter="url(#shadow)">
    <rect x="370" y="226" width="290" height="190" rx="22" fill="url(#agent1)" stroke="#4c7399" stroke-width="1.8"/>
    <rect x="392" y="248" width="86" height="27" rx="8" fill="#29445f"/>
    <text x="435" y="267" text-anchor="middle" class="node-label" fill="#8dcbff">AGENT 1</text>
    <text x="392" y="310" class="node-title">냉장고 관리사</text>
    <circle cx="401" cy="342" r="4" fill="#6fb3ff"/>
    <text x="415" y="348" class="node-copy">임박·폐기 재료 브리핑</text>
    <circle cx="401" cy="372" r="4" fill="#6fb3ff"/>
    <text x="415" y="378" class="node-copy">요리 타입 자동 추천</text>
    <rect x="550" y="376" width="86" height="24" rx="12" fill="#d9ebff"/>
    <text x="593" y="393" text-anchor="middle" font-size="13" font-weight="900" fill="#17324d">결과 A</text>
  </g>

  <!-- Direct path label -->
  <path d="M 660 278 C 772 278, 886 278, 1074 278" fill="none" stroke="#6fb3ff" stroke-width="3" marker-end="url(#arrowBlue)"/>
  <g transform="translate(742 251)">
    <rect width="232" height="40" rx="20" fill="#152538" stroke="#4c7399"/>
    <text x="116" y="26" text-anchor="middle" class="flow-label" fill="#9fd2ff">홈 바로 장보기 · A 전달</text>
  </g>

  <!-- Required retailer choice -->
  <g transform="translate(752 326)">
    <rect width="244" height="72" rx="16" fill="#171a21" stroke="#4a515e"/>
    <text x="122" y="27" text-anchor="middle" class="node-small">장보기 전 필수 선택</text>
    <rect x="20" y="39" width="92" height="23" rx="11.5" fill="#eff2f6"/>
    <text x="66" y="55" text-anchor="middle" font-size="12" font-weight="900" fill="#b52b22">COUPANG</text>
    <rect x="132" y="39" width="92" height="23" rx="11.5" fill="#f2edf6"/>
    <text x="178" y="55" text-anchor="middle" font-size="12" font-weight="900" fill="#6f1686">KURLY</text>
  </g>
  <path d="M 996 362 C 1030 362, 1037 336, 1074 326" fill="none" stroke="#cfd5df" stroke-width="2.3" stroke-dasharray="6 6" marker-end="url(#arrowSilver)"/>

  <!-- User cuisine choice -->
  <g transform="translate(404 458)">
    <rect width="222" height="48" rx="24" fill="#1b1e25" stroke="#4a515e"/>
    <text x="111" y="31" text-anchor="middle" class="pill-text" fill="#e8ecf2">사용자 요리 타입 선택</text>
  </g>
  <path d="M 515 416 L 515 456" stroke="#cfd5df" stroke-width="2.4" marker-end="url(#arrowSilver)"/>
  <path d="M 626 482 C 660 482, 674 520, 706 520" fill="none" stroke="#ffad55" stroke-width="2.4" marker-end="url(#arrowOrange)"/>

  <!-- Agent 2 -->
  <g filter="url(#shadow)">
    <rect x="708" y="454" width="290" height="198" rx="22" fill="url(#agent2)" stroke="#8d6840" stroke-width="1.8"/>
    <rect x="730" y="476" width="86" height="27" rx="8" fill="#604727"/>
    <text x="773" y="495" text-anchor="middle" class="node-label" fill="#ffc57d">AGENT 2</text>
    <text x="730" y="538" class="node-title">전문 요리사</text>
    <text x="730" y="569" class="node-small">한식 · 중식 · 양식 · 일식</text>
    <circle cx="739" cy="601" r="4" fill="#ffad55"/>
    <text x="753" y="607" class="node-copy">타입 정체성 있는 레시피</text>
    <rect x="888" y="611" width="86" height="24" rx="12" fill="#ffe7c8"/>
    <text x="931" y="628" text-anchor="middle" font-size="13" font-weight="900" fill="#503315">결과 B</text>
  </g>

  <!-- A context into Agent 2 -->
  <path d="M 578 416 C 578 442, 680 428, 735 454" fill="none" stroke="#6fb3ff" stroke-width="2.8" marker-end="url(#arrowBlue)"/>
  <rect x="608" y="418" width="92" height="28" rx="14" fill="#17283a" stroke="#365d83"/>
  <text x="654" y="437" text-anchor="middle" class="flow-label" fill="#91caff">context A</text>

  <!-- Agent 3 -->
  <g filter="url(#shadow)">
    <rect x="1076" y="454" width="290" height="198" rx="22" fill="url(#agent3)" stroke="#73549b" stroke-width="1.8"/>
    <rect x="1098" y="476" width="86" height="27" rx="8" fill="#4b3567"/>
    <text x="1141" y="495" text-anchor="middle" class="node-label" fill="#d1aaff">AGENT 3</text>
    <rect x="1260" y="476" width="82" height="27" rx="8" fill="#20344a" stroke="#4f779e"/>
    <text x="1301" y="495" text-anchor="middle" font-size="12" font-weight="900" fill="#91caff">WEB × 1</text>
    <text x="1098" y="538" class="node-title">레시피 검증관</text>
    <circle cx="1107" cy="571" r="4" fill="#bb8cff"/>
    <text x="1121" y="577" class="node-copy">실존·유사 레시피 검색</text>
    <circle cx="1107" cy="603" r="4" fill="#bb8cff"/>
    <text x="1121" y="609" class="node-copy">타입·조리 가능성 검증</text>
    <text x="1098" y="634" class="node-small">통과 · 보완허용 · 탈락</text>
  </g>

  <!-- Agent 2 to Agent 3 -->
  <path d="M 998 546 L 1074 546" fill="none" stroke="#bb8cff" stroke-width="3" marker-end="url(#arrowPurple)"/>
  <rect x="1008" y="506" width="58" height="28" rx="14" fill="#2d213d" stroke="#62458a"/>
  <text x="1037" y="525" text-anchor="middle" class="flow-label" fill="#cea9ff">A+B</text>

  <!-- Retry loop -->
  <path d="M 1218 652 C 1218 720, 858 720, 858 654" fill="none" stroke="#ff7c73" stroke-width="2.4" stroke-dasharray="8 7" marker-end="url(#arrowOrange)"/>
  <g transform="translate(935 690)">
    <rect width="208" height="36" rx="18" fill="#351d20" stroke="#854342"/>
    <text x="104" y="24" text-anchor="middle" class="flow-label" fill="#ff9d96">탈락 사유 전달 · 1회 재생성</text>
  </g>

  <!-- Agent 4 -->
  <g filter="url(#shadow)">
    <rect x="1076" y="204" width="290" height="198" rx="22" fill="url(#agent4)" stroke="#3d826d" stroke-width="1.8"/>
    <rect x="1098" y="226" width="86" height="27" rx="8" fill="#285846"/>
    <text x="1141" y="245" text-anchor="middle" class="node-label" fill="#86e4c1">AGENT 4</text>
    <text x="1098" y="288" class="node-title">장보기 관리사</text>
    <circle cx="1107" cy="321" r="4" fill="#63d6ad"/>
    <text x="1121" y="327" class="node-copy">ReAct 보충 구매 판단</text>
    <circle cx="1107" cy="353" r="4" fill="#63d6ad"/>
    <text x="1121" y="359" class="node-copy">선택 플랫폼 링크 강제</text>
    <rect x="1244" y="362" width="98" height="24" rx="12" fill="#d5f6e9"/>
    <text x="1293" y="379" text-anchor="middle" font-size="13" font-weight="900" fill="#174938">A 또는 A+B</text>
  </g>

  <!-- Verified recipe path to Agent 4 -->
  <path d="M 1221 454 L 1221 404" fill="none" stroke="#63d6ad" stroke-width="3" marker-end="url(#arrowGreen)"/>
  <g transform="translate(1117 411)">
    <rect width="208" height="34" rx="17" fill="#173229" stroke="#397c68"/>
    <text x="104" y="23" text-anchor="middle" class="flow-label" fill="#8be5c4">검증된 A+B 전달</text>
  </g>

  <!-- Shopping output -->
  <g filter="url(#shadow)">
    <rect x="1412" y="204" width="128" height="448" rx="22" fill="#20242c" stroke="#56606f" stroke-width="1.6"/>
    <rect x="1430" y="226" width="92" height="27" rx="8" fill="#343b47"/>
    <text x="1476" y="245" text-anchor="middle" class="node-label" fill="#d9dee7">OUTPUT</text>
    <text x="1432" y="291" font-size="21" font-weight="900" fill="#f5f7fa">보충</text>
    <text x="1432" y="319" font-size="21" font-weight="900" fill="#f5f7fa">장보기</text>

    <line x1="1432" y1="346" x2="1520" y2="346" stroke="#414956"/>
    <text x="1432" y="380" class="node-small">현재 잔량</text>
    <text x="1432" y="406" class="node-small">폐기 여부</text>
    <text x="1432" y="432" class="node-small">2열 목록</text>

    <rect x="1430" y="468" width="92" height="58" rx="12" fill="#f0f2f5"/>
    <text x="1476" y="493" text-anchor="middle" font-size="12" font-weight="900" fill="#b52b22">쿠팡</text>
    <text x="1476" y="514" text-anchor="middle" font-size="11" font-weight="800" fill="#272b32">바로가기</text>
    <rect x="1430" y="538" width="92" height="58" rx="12" fill="#f4eef7"/>
    <text x="1476" y="563" text-anchor="middle" font-size="12" font-weight="900" fill="#6f1686">컬리</text>
    <text x="1476" y="584" text-anchor="middle" font-size="11" font-weight="800" fill="#272b32">바로가기</text>
    <text x="1476" y="628" text-anchor="middle" font-size="12" font-weight="800" fill="#87909e">내부 스크롤</text>
  </g>
  <path d="M 1366 302 L 1409 302" fill="none" stroke="#cfd5df" stroke-width="3" marker-end="url(#arrowSilver)"/>

  <!-- Bottom summary -->
  <g transform="translate(72 774)">
    <rect width="1468" height="62" rx="18" fill="#15181f" stroke="#303743"/>
    <g transform="translate(28 0)">
      <circle cx="11" cy="31" r="6" fill="#6fb3ff"/>
      <text x="31" y="27" class="footer-title">A · 냉장고 브리핑</text>
      <text x="31" y="47" class="footer-copy">임박·폐기 재료 + 추천 타입</text>
    </g>
    <line x1="350" y1="14" x2="350" y2="48" stroke="#343b47"/>
    <g transform="translate(378 0)">
      <circle cx="11" cy="31" r="6" fill="#ffad55"/>
      <text x="31" y="27" class="footer-title">B · 선택 레시피</text>
      <text x="31" y="47" class="footer-copy">Agent 3 웹 검색 + 검증 통과</text>
    </g>
    <line x1="790" y1="14" x2="790" y2="48" stroke="#343b47"/>
    <g transform="translate(818 0)">
      <circle cx="11" cy="31" r="6" fill="#63d6ad"/>
      <text x="31" y="27" class="footer-title">2개 장보기 경로</text>
      <text x="31" y="47" class="footer-copy">홈: A · 요리 후: 검증된 A+B</text>
    </g>
    <line x1="1162" y1="14" x2="1162" y2="48" stroke="#343b47"/>
    <g transform="translate(1190 0)">
      <circle cx="11" cy="31" r="6" fill="#e8ecf2"/>
      <text x="31" y="27" class="footer-title">Biz 연결</text>
      <text x="31" y="47" class="footer-copy">폐기 감소 → 구매 전환</text>
    </g>
  </g>
</svg>
